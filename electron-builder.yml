appId: com.example.desktop-agent-starter
productName: Mac Do Over
# output dir is passed on the command line (see package.json "package"): electron-builder rejects paths containing shell-special characters such as '&'.
files:
  - dist/**
  - renderer/**
  - lib/**
  - build/Release/*.node
  - assets/**
  - package.json
  # get-windows ships a build toolchain for compiling its Windows addon: node-gyp, cacache,
  # make-fetch-happen and a vulnerable tar. This app is macOS-only and uses the prebuilt binary,
  # so none of it is reachable. Excluding it keeps six advisories out of the shipped bundle.
  - "!node_modules/get-windows/node_modules/**"
  - "!node_modules/@mapbox/**"
  - "!node_modules/node-gyp/**"
  - "!node_modules/cacache/**"
  - "!node_modules/make-fetch-happen/**"
  - "!node_modules/tar/**"
  - "!node_modules/get-windows/Sources/**"
  - "!node_modules/get-windows/binding.gyp"
  - "!node_modules/get-windows/lib/windows.js"
asarUnpack:
  - build/Release/*.node
  - node_modules/uiohook-napi/**
  - node_modules/get-windows/**
npmRebuild: false
mac:
  target:
    - target: dir
      arch: [arm64]
  # null = electron-builder does not sign; scripts/sign-adhoc.mjs signs afterwards.
  # For STABLE permission grants across rebuilds, set this to an "Apple Development: …" identity instead.
  identity: null
  hardenedRuntime: false
  extendInfo:
    LSUIElement: true
    NSScreenCaptureUsageDescription: Captures the screen into a short in-memory buffer.
    NSAccessibilityUsageDescription: Reads window titles and positions.
